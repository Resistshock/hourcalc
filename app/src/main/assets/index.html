<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0e14"><title>ResistCalc</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark} body{margin:0;padding:22px 16px 32px;background:#0b0e14;color:#e8edf5;font:15px system-ui,-apple-system,Arial,sans-serif}.app{max-width:720px;margin:auto}.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin:8px 0 5px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#4b91ff,#2354bd);display:grid;place-items:center;font-size:21px;font-weight:800}.brand h1{font-size:24px;letter-spacing:.3px;margin:0}.sub{text-align:center;color:#77869c;font-size:13px;margin-bottom:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel,.result,.history{background:#141a24;border:1px solid #252f40;border-radius:16px;padding:17px}.panel h2,.history h2{font-size:12px;letter-spacing:1.3px;color:#91a3bd;margin:0 0 15px}.panel label{display:block;color:#8493a8;font-size:12px;margin-bottom:8px}input{width:100%;min-width:0;padding:13px 10px;border:1px solid #303d51;border-radius:10px;background:#0d131d;color:#f4f7fc;font:14px system-ui;outline:none}input:focus{border-color:#5794ff}.btn{border:0;border-radius:10px;padding:13px 15px;font-weight:700;font-size:13px;cursor:pointer}.primary{width:100%;margin:14px 0;background:#397cf6;color:white}.primary:active{background:#2865d0}.result{text-align:center;margin-bottom:15px;padding:22px 15px}.kicker{color:#8493a8;font-size:11px;letter-spacing:1.6px}.value{font-size:clamp(28px,7vw,42px);font-weight:750;margin:13px 0 8px;line-height:1.2}.details{color:#91a3bd;font-size:13px}.history{margin-top:15px}.hist-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.hist-head h2{margin:0}.secondary{background:#263246;color:#c2cee0;padding:9px 11px;font-size:12px}.entry{padding:14px 0;border-top:1px solid #293344}.entrytop{display:flex;align-items:center;justify-content:space-between;gap:8px}.entryval{font-weight:750;color:#80adff;font-size:16px}.actions{display:flex;gap:6px}.actions button{border:0;border-radius:8px;padding:7px 9px;background:#263246;color:#c8d3e2;font-size:12px}.actions .del{color:#ff9696}.dates{white-space:pre-line;color:#8392a7;font-size:11px;line-height:1.7;margin-top:7px}.empty{text-align:center;color:#738198;padding:23px 0;font-size:13px}.tools{display:flex;gap:8px;margin-top:12px}.tools button{flex:1}.hint{text-align:center;color:#65738a;font-size:11px;margin-top:15px}@media(max-width:480px){.grid{grid-template-columns:1fr}.panel{padding:15px}.brand h1{font-size:22px}}
</style></head><body><main class="app"><div class="brand"><div class="logo">R</div><h1>ResistCalc</h1></div><div class="sub">Калькулятор времени · история измерений</div>
<div class="grid"><section class="panel"><h2>НАЧАЛО</h2><label for="start">Дата и время</label><input id="start" type="datetime-local"></section><section class="panel"><h2>ОКОНЧАНИЕ</h2><label for="end">Дата и время</label><input id="end" type="datetime-local"></section></div>
<button class="btn primary" id="calc">РАССЧИТАТЬ И СОХРАНИТЬ</button>
<section class="result"><div class="kicker">ПРОШЛО ВРЕМЕНИ</div><div class="value" id="result">0 ч. 0 мин.</div><div class="details" id="details">Всего 0 часов</div></section>
<section class="history"><div class="hist-head"><h2>ИСТОРИЯ</h2><button class="btn secondary" id="clear">Очистить</button></div><div id="list"></div><div class="tools"><button class="btn secondary" id="export">Экспорт JSON</button><button class="btn secondary" id="import">Импорт JSON</button><input id="file" type="file" accept="application/json,.json" hidden></div></section><div class="hint">Данные хранятся только на этом устройстве</div></main>
<script>
'use strict';const $=id=>document.getElementById(id),KEY='resistcalc.history.v1',LIMIT=500;
const pad=n=>String(n).padStart(2,'0'),local=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmt=s=>new Date(s).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'});
function parts(ms){let m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),n=m%60,all=Math.floor(m/60);return{main:[d&&`${d} дн.`,(d||h)&&`${h} ч.`,`${n} мин.`].filter(Boolean).join(' '),details:`Всего ${all.toLocaleString('ru-RU')} ч. ${n} мин. · ${(m/60).toFixed(2)} часа`}}
function read(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.filter(v=>v&&typeof v.start==='string'&&typeof v.end==='string'&&Number.isFinite(v.ms)&&v.ms>=0):[]}catch{return[]}}
let history=read();function persist(){try{localStorage.setItem(KEY,JSON.stringify(history));render()}catch{alert('Не удалось сохранить историю: недостаточно места в памяти устройства.')}}
function calc(keep=true){let a=$('start').value,b=$('end').value;if(!a||!b)return alert('Укажи начало и окончание');let x=new Date(a),y=new Date(b),ms=y-x;if(!Number.isFinite(ms))return alert('Некорректная дата');if(ms<0)return alert('Окончание раньше начала');let p=parts(ms);$('result').textContent=p.main;$('details').textContent=p.details;if(keep){history.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2),start:a,end:b,ms,created:new Date().toISOString()});history=history.slice(0,LIMIT);persist()}}
function render(){let root=$('list');root.replaceChildren();if(!history.length){let e=document.createElement('div');e.className='empty';e.textContent='Сохранённых измерений пока нет';root.append(e);return}history.forEach(v=>{let e=document.createElement('article');e.className='entry';let top=document.createElement('div');top.className='entrytop';let val=document.createElement('div');val.className='entryval';val.textContent=parts(v.ms).main;let acts=document.createElement('div');acts.className='actions';let open=document.createElement('button');open.textContent='Открыть';open.onclick=()=>{$('start').value=v.start;$('end').value=v.end;calc(false);window.scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.className='del';del.textContent='Удалить';del.onclick=()=>{history=history.filter(z=>z.id!==v.id);persist()};acts.append(open,del);top.append(val,acts);let dates=document.createElement('div');dates.className='dates';dates.textContent=`Начало: ${fmt(v.start)}\nКонец: ${fmt(v.end)}`;e.append(top,dates);root.append(e)})}
$('calc').onclick=()=>calc();$('clear').onclick=()=>{if(history.length&&confirm('Удалить всю историю?')){history=[];persist()}};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'ResistCalc',version:1,history},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='resistcalc-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),items=Array.isArray(d)?d:d.history;if(!Array.isArray(items))throw Error();let valid=items.filter(v=>v&&typeof v.start==='string'&&typeof v.end==='string'&&Number.isFinite(v.ms)&&v.ms>=0).map(v=>({...v,id:v.id||Date.now()+'-'+Math.random()}));if(!valid.length)throw Error();history=[...valid,...history].slice(0,LIMIT);persist();alert(`Импортировано записей: ${valid.length}`)}catch{alert('Не удалось прочитать файл истории')}e.target.value=''};
$('end').value=local(new Date());render();
</script></body></html>
